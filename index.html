<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Gym Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%232783DE'/%3E%3Crect x='38' y='78' width='104' height='24' rx='8' fill='white'/%3E%3Crect x='26' y='60' width='20' height='60' rx='7' fill='white'/%3E%3Crect x='134' y='60' width='20' height='60' rx='7' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --canvas:#ffffff; --soft:#f9f8f7; --soft2:#f0efed; --border:#e6e5e3;
  --text:#2c2c2b; --muted:#7d7a75;
  --blue:#2783de; --blue-soft:#e5f2fc;
  --green:#46a171; --green-soft:#e8f1ec;
  --orange:#d5803b; --orange-soft:#fbebde;
  --red:#e56458; --red-soft:#fce9e7;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --canvas:#191919; --soft:#202020; --soft2:#383836; --border:rgba(255,255,255,.2);
    --text:#ffffff; --muted:rgba(255,255,255,.65);
    --blue:#5e9fe8; --blue-soft:rgba(94,159,232,.12);
    --green:#72bc8f; --green-soft:rgba(114,188,143,.12);
    --orange:#de9255; --orange-soft:rgba(222,146,85,.12);
    --red:#e97366; --red-soft:rgba(233,115,102,.12);
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom));}
header.top{position:sticky;top:0;z-index:20;background:var(--canvas);padding:calc(12px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:15px;font-weight:800;letter-spacing:.06em}
.brand span{color:var(--blue)}
.top-meta{font-size:13px;color:var(--muted);white-space:nowrap}
h1{font-size:26px;line-height:1.2;font-weight:750;margin:20px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
section{margin-bottom:16px}
.card{background:var(--canvas);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.card.soft{background:var(--soft);box-shadow:none}
.card + .card{margin-top:12px}
.card h2{font-size:17px;font-weight:700;margin:0 0 4px}
.card p.hint{margin:0;color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:22px;font-weight:750;line-height:1.2}
.tile span{font-size:13px;color:var(--muted)}
label.field{display:block;margin-bottom:12px}
label.field > span{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:6px}
select,input[type=text],input[type=number]{
  width:100%;min-height:48px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--text);
  background:var(--canvas);border:1px solid var(--border);border-radius:10px;appearance:none;
}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper button{
  min-height:52px;min-width:52px;font-size:22px;font-weight:700;border-radius:12px;
  border:1px solid var(--border);background:var(--soft);color:var(--text);cursor:pointer
}
.stepper button:active{background:var(--soft2)}
.stepper .val{text-align:center;border:1px solid var(--border);border-radius:12px;min-height:52px;
  display:flex;flex-direction:column;justify-content:center;background:var(--canvas)}
.stepper .val b{font-size:20px;font-weight:750;line-height:1.1}
.stepper .val span{font-size:11px;color:var(--muted)}
button.btn{
  width:100%;min-height:52px;padding:14px 18px;font-size:16px;font-weight:700;font-family:inherit;
  border-radius:12px;border:1px solid var(--border);background:var(--canvas);color:var(--text);cursor:pointer
}
button.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.btn.danger{color:var(--red);border-color:var(--red)}
button.btn.ghost{background:var(--soft)}
button.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;gap:10px}
.btn-row > *{flex:1}
.note{background:var(--blue-soft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--text)}
.note.warn{background:var(--orange-soft)}
.note.ok{background:var(--green-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.orange{background:var(--orange-soft);color:var(--orange)}
.pill.green{background:var(--green-soft);color:var(--green)}
.setlist{list-style:none;margin:12px 0 0;padding:0}
.setlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:15px}
.setlist li .idx{width:24px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.setlist li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setlist li .num{font-variant-numeric:tabular-nums;font-weight:650}
.setlist li button{width:44px;height:44px;border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:10px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{position:relative;width:180px;height:180px}
.ring svg{transform:rotate(-90deg)}
.ring .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:750;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:0 0 8px}
th.num{text-align:right;padding-left:10px;white-space:nowrap}
td{padding:10px 0;border-top:1px solid var(--border);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
td.pillcell{text-align:right;white-space:nowrap;width:1px;padding-left:12px}
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--canvas);border-top:1px solid var(--border);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:2px
}
nav.tabs .inner{display:flex;width:100%;max-width:480px}
nav.tabs button{
  flex:1;min-height:56px;border:none;background:transparent;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;
  font-size:11px;font-weight:650;border-radius:12px
}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--blue);background:var(--blue-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.overlay{position:fixed;inset:0;z-index:50;background:var(--canvas);overflow-y:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.overlay .inner{max-width:480px;margin:0 auto}
.chart{width:100%;height:190px;display:block}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .line{stroke:var(--blue);stroke-width:2.5;fill:none;stroke-linejoin:round}
.chart .area{fill:var(--blue-soft)}
.chart .pt{fill:var(--blue)}
.chart text{fill:var(--muted);font-size:10px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.restbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:40;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.restbar .inner{pointer-events:auto;width:100%;max-width:480px;display:flex;align-items:center;gap:10px;
  background:var(--canvas);border:1px solid var(--border);border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.restbar .lead{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.restbar.done .lead{background:var(--green)}
.restbar .txt{flex:1;min-width:0}
.restbar .txt b{display:block;font-size:19px;font-weight:750;line-height:1.15;font-variant-numeric:tabular-nums}
.restbar .txt span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.restbar button{min-height:44px;min-width:56px;padding:0 10px;border-radius:10px;border:1px solid var(--border);
  background:var(--soft);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
details.scale{margin-top:8px;border:1px solid var(--border);border-radius:10px;background:var(--soft);overflow:hidden}
details.scale summary{cursor:pointer;padding:11px 12px;font-size:13px;font-weight:650;color:var(--muted);list-style:none}
details.scale summary::-webkit-details-marker{display:none}
details.scale .body{padding:0 12px 8px}
table.rpe td{font-size:13px;padding:7px 0}
table.rpe td:first-child{width:46px;font-weight:750;font-variant-numeric:tabular-nums}
table.rpe td:nth-child(2){width:78px;color:var(--muted);white-space:nowrap}
table.rpe tr.now td{color:var(--blue);font-weight:700}
@media (prefers-reduced-motion: no-preference){
  .ring circle.prog{transition:stroke-dashoffset .4s linear}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="restbarHost"></div>
<nav class="tabs" id="tabs"></nav>
<div id="overlay"></div>

<script>
"use strict";

/* =====================================================================
   1. СПРАВОЧНИКИ (точно так же, как в десктопной версии на Python)
   ===================================================================== */
const CATS = {
  compound_barbell:      {label:"Штанга (компаунд)",       repLow:5,  repHigh:8,  step:2.5, rest:"base"},
  compound_barbell_leg:  {label:"Штанга, ноги/спина",      repLow:5,  repHigh:8,  step:5.0, rest:"base"},
  compound_dumbbell:     {label:"Гантели (компаунд)",      repLow:8,  repHigh:12, step:2.0, rest:"base"},
  compound_cable_machine:{label:"Блок/тренажёр (компаунд)",repLow:8, repHigh:12, step:5.0, rest:"base"},
  compound_bodyweight:   {label:"Свой вес (компаунд)",     repLow:6,  repHigh:12, step:2.5, rest:"base"},
  isolation_dumbbell:    {label:"Гантели (изоляция)",      repLow:10, repHigh:15, step:1.0, rest:"iso"},
  isolation_barbell:     {label:"Штанга (изоляция)",       repLow:8,  repHigh:12, step:2.5, rest:"iso"},
  isolation_cable_machine:{label:"Блок/тренажёр (изоляция)",repLow:10,repHigh:15, step:2.5, rest:"iso"}
};

const CATALOG = {
  "Жим штанги лёжа":"compound_barbell",
  "Жим штанги на наклонной скамье":"compound_barbell",
  "Присед со штангой":"compound_barbell_leg",
  "Становая тяга":"compound_barbell_leg",
  "Румынская становая тяга":"compound_barbell_leg",
  "Жим штанги стоя (армейский)":"compound_barbell",
  "Тяга штанги в наклоне":"compound_barbell",
  "Жим гантелей лёжа":"compound_dumbbell",
  "Жим гантелей на наклонной скамье":"compound_dumbbell",
  "Жим гантелей сидя (плечи)":"compound_dumbbell",
  "Тяга гантели в наклоне одной рукой":"compound_dumbbell",
  "Выпады с гантелями":"compound_dumbbell",
  "Жим ногами в тренажёре":"compound_cable_machine",
  "Тяга верхнего блока":"compound_cable_machine",
  "Тяга нижнего блока (горизонтальная тяга)":"compound_cable_machine",
  "Гакк-присед в тренажёре":"compound_cable_machine",
  "Подтягивания":"compound_bodyweight",
  "Отжимания на брусьях":"compound_bodyweight",
  "Отжимания от пола":"compound_bodyweight",
  "Подъём штанги на бицепс":"isolation_barbell",
  "Французский жим штанги лёжа":"isolation_barbell",
  "Подъём гантелей на бицепс":"isolation_dumbbell",
  "Разведение гантелей в стороны (дельты)":"isolation_dumbbell",
  "Разведение гантелей лёжа":"isolation_dumbbell",
  "Французский жим с гантелью":"isolation_dumbbell",
  "Разгибание рук на блоке (трицепс)":"isolation_cable_machine",
  "Сгибание рук на блоке (бицепс)":"isolation_cable_machine",
  "Разведение в тренажёре (пе��-дек)":"isolation_cable_machine",
  "Сгибание ног в тренажёре":"isolation_cable_machine",
  "Разгибание ног в тренажёре":"isolation_cable_machine",
  "Подъём на носки (икры)":"isolation_cable_machine",
  "Гиперэкстензия":"compound_bodyweight"
};
const DEFAULT_CATEGORY = "compound_barbell";

const EQUIP_BY_CAT = {
  compound_barbell:"barbell", compound_barbell_leg:"barbell", isolation_barbell:"barbell",
  compound_dumbbell:"dumbbell", isolation_dumbbell:"dumbbell",
  compound_cable_machine:"machine", isolation_cable_machine:"machine",
  compound_bodyweight:"bodyweight"
};
const EQUIP_LABEL = {barbell:"Штанга", dumbbell:"Гантели", machine:"Блок / тренажёр", bodyweight:"Свой вес (доп. вес)"};
const EQUIP_HINT = {
  barbell:"Минимальный шаг = два самых лёгких блина (часто 2×1.25 = 2.5 кг)",
  dumbbell:"Шаг между соседними гантелями в вашем зале",
  machine:"Шаг плитки тренажёра (часто 5 кг)",
  bodyweight:"Шаг дополнительного веса на поясе или в жилете"
};
const STEP_KEYS = {barbell:"step_barbell", dumbbell:"step_dumbbell", machine:"step_machine", bodyweight:"step_bodyweight"};
const ROUNDING = {nearest:"К ближайшему доступному весу", down:"Вниз (консервативно)", up:"Вверх (агрессивно)"};
const DEFAULT_SETTINGS = {
  step_barbell:2.5, step_dumbbell:2.5, step_machine:5.0, step_bodyweight:2.5,
  rounding:"nearest", rest_base:180, rest_iso:60, auto_rest:true,
  sound:true, volume:70, vibrate:true, countdown:true, notify:false, keep_awake:true
};
const REST_DECAY = 5, REST_MIN = 30;

/* Шкала RPE / RIR (RIR = сколько повторений осталось в запасе).
   Рабочая зона гипертрофии — RPE 7–8.5 (в запасе 2–3 повторения). */
const RPE_SCALE = [
  {rpe:5,   rir:"~5+",  feel:"Очень легко"},
  {rpe:5.5, rir:"~4–5", feel:"Очень легко"},
  {rpe:6,   rir:"~4",   feel:"Легко"},
  {rpe:6.5, rir:"~3–4", feel:"Легко"},
  {rpe:7,   rir:"~3",   feel:"Умеренно тяжело"},
  {rpe:7.5, rir:"~2–3", feel:"Умеренно тяжело"},
  {rpe:8,   rir:"~2",   feel:"Тяжело"},
  {rpe:8.5, rir:"~1–2", feel:"Тяжело"},
  {rpe:9,   rir:"~1",   feel:"Очень тяжело"},
  {rpe:9.5, rir:"0–1",  feel:"Почти отказ"},
  {rpe:10,  rir:"0",    feel:"Максимум, отказ"}
];
const RPE_WORK_LOW = 7, RPE_WORK_HIGH = 8.5;
function rpeInfo(v){
  const num = Number(v);
  return RPE_SCALE.find(x => x.rpe === num) || (num < 5 ? {rpe:num, rir:"6+", feel:"Разминка"} : {rpe:num, rir:"—", feel:"—"});
}

/* =====================================================================
   2. ДАННЫЕ (формат полностью совместим с gym_data.json)
   ===================================================================== */
const LS_DATA = "gymTracker.data", LS_SESSION = "gymTracker.session", LS_REST = "gymTracker.rest";

function emptyData(){ return {logs:[], custom_categories:{}, workouts:[], settings:{...DEFAULT_SETTINGS}}; }

function normalizeData(raw){
  const d = raw && typeof raw === "object" ? raw : {};
  return {
    logs: Array.isArray(d.logs) ? d.logs : [],
    custom_categories: d.custom_categories && typeof d.custom_categories === "object" ? d.custom_categories : {},
    workouts: Array.isArray(d.workouts) ? d.workouts : [],
    settings: {...DEFAULT_SETTINGS, ...(d.settings || {})}
  };
}

function loadData(){
  try { return normalizeData(JSON.parse(localStorage.getItem(LS_DATA))); }
  catch(e){ return emptyData(); }
}
function saveData(){
  try { localStorage.setItem(LS_DATA, JSON.stringify(state.data)); } catch(e){}
}
function loadSession(){
  try { const s = JSON.parse(localStorage.getItem(LS_SESSION)); return s && s.startedAt ? s : null; }
  catch(e){ return null; }
}
function saveSession(){
  try {
    if (state.session) localStorage.setItem(LS_SESSION, JSON.stringify(state.session));
    else localStorage.removeItem(LS_SESSION);
  } catch(e){}
}

/* =====================================================================
   3. АЛГОРИТМЫ ПРОГРЕССИИ И АНАЛИТИКИ
   ===================================================================== */
const norm = n => String(n||"").trim().toLowerCase();
const round2 = v => Math.round(v*100)/100;

function categoryKey(name, data){
  if (CATALOG[name]) return CATALOG[name];
  const custom = data.custom_categories || {};
  if (custom[norm(name)]) return custom[norm(name)];
  return DEFAULT_CATEGORY;
}
const exerciseInfo = (name,data) => CATS[categoryKey(name,data)];
const equipmentOf = (name,data) => EQUIP_BY_CAT[categoryKey(name,data)] || "barbell";
const settingsOf = data => ({...DEFAULT_SETTINGS, ...(data.settings||{})});

function stepFor(name, data){
  const s = settingsOf(data);
  let step = parseFloat(s[STEP_KEYS[equipmentOf(name,data)]]);
  if (!isFinite(step) || step <= 0) step = CATS[categoryKey(name,data)].step;
  return round2(step);
}

function roundToStep(value, step, mode){
  if (!(step > 0)) return round2(value);
  let ratio = value/step;
  if (mode === "down") ratio = Math.floor(ratio + 1e-9);
  else if (mode === "up") ratio = Math.ceil(ratio - 1e-9);
  else ratio = Math.round(ratio);
  return round2(ratio*step);
}

function logsFor(data, name){
  const key = norm(name);
  return data.logs.filter(l => norm(l.ex) === key).sort((a,b) => String(a.date).localeCompare(String(b.date)));
}

function suggestNext(data, name){
  const info = exerciseInfo(name, data), s = settingsOf(data);
  const step = stepFor(name, data), mode = s.rounding || "nearest";
  const logs = logsFor(data, name);
  const repRange = info.repLow + "-" + info.repHigh;
  const equipment = EQUIP_LABEL[equipmentOf(name, data)];

  if (!logs.length){
    return {weight:null, repsHint:repRange, step, equipment,
      note:"Нет истории. Начните с комфортного веса на " + repRange + " повторений."};
  }
  const last = logs[logs.length-1], lastTwo = logs.slice(-2);
  const deload = lastTwo.length === 2 && lastTwo.every(l => l.rpe >= 9.5 || (l.rpe >= 9 && l.r < info.repLow));
  const rir = rpeInfo(last.rpe).rir;
  let weight, note;

  if (deload){
    weight = roundToStep(last.w*0.9, step, "down");
    note = "Две сессии подряд на RPE 9.5–10 (в запасе 0–1 повторение) — разгрузка ~10%, чтобы вернуться в рабочую зону RPE " + RPE_WORK_LOW + "–" + RPE_WORK_HIGH + ".";
  } else if (last.r >= info.repHigh && last.rpe <= 6.5){
    weight = roundToStep(last.w + 2*step, step, mode);
    if (weight <= last.w) weight = round2(last.w + 2*step);
    note = "Верх диапазона и RPE " + last.rpe + " (в запасе " + rir + " повт.) — слишком легко, можно сразу +" + round2(2*step) + " кг (" + equipment + ").";
  } else if (last.r >= info.repHigh && last.rpe <= RPE_WORK_HIGH){
    weight = roundToStep(last.w + step, step, mode);
    if (weight <= last.w) weight = round2(last.w + step);
    note = "Верх диапазона при RPE " + last.rpe + " (в запасе " + rir + " повт.) — вес +" + step + " кг (" + equipment + "), повторения снова от " + info.repLow + ".";
  } else if (last.rpe >= 9 || last.r < info.repLow){
    weight = last.w;
    note = "Прошлый подход шёл на RPE " + last.rpe + " (в запасе " + rir + " повт.) — вес держим, цель добрать повторения при RPE " + RPE_WORK_LOW + "–" + RPE_WORK_HIGH + ".";
  } else {
    weight = last.w;
    note = "Повторения в диапазоне " + repRange + ", RPE " + last.rpe + " — это рабочая зона. Держим вес и добираем повторения (следующий шаг +" + step + " кг).";
  }
  return {weight, repsHint:repRange, step, equipment, note};
}

function restSeconds(name, setNumber, data){
  const s = settingsOf(data);
  const kind = exerciseInfo(name, data).rest;
  const base = kind === "base" ? parseInt(s.rest_base,10) : parseInt(s.rest_iso,10);
  return Math.max(base - REST_DECAY*Math.max(setNumber-1,0), REST_MIN);
}

const e1rm = (w,r) => (w>0 && r>0) ? Math.round(w*(1 + r/30)*10)/10 : 0;

function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h) return h + " ч " + m + " мин";
  if (m) return m + " мин " + String(s).padStart(2,"0") + " с";
  return s + " с";
}
const mmss = sec => Math.floor(sec/60) + ":" + String(Math.max(0,sec)%60).padStart(2,"0");

function summarize(entries, startedAt, finishedAt){
  if (!entries.length) return null;
  const volume = entries.reduce((a,e) => a + e.w*e.r, 0);
  const avgRpe = entries.reduce((a,e) => a + e.rpe, 0)/entries.length;
  const byEx = {};
  entries.forEach(e => {
    const st = byEx[e.ex] || (byEx[e.ex] = {sets:0, volume:0, reps:0, rpe:0, best1rm:0});
    st.sets++; st.volume += e.w*e.r; st.reps += e.r; st.rpe += e.rpe;
    st.best1rm = Math.max(st.best1rm, e1rm(e.w, e.r));
  });
  Object.values(byEx).forEach(st => { st.avgRpe = st.rpe/st.sets; st.volume = Math.round(st.volume*10)/10; });
  const best = entries.reduce((a,b) => e1rm(b.w,b.r) > e1rm(a.w,a.r) ? b : a);
  let duration = null;
  if (startedAt && finishedAt){
    const d = (new Date(finishedAt) - new Date(startedAt))/1000;
    if (isFinite(d) && d >= 0) duration = d;
  }
  return {sets:entries.length, exercises:Object.keys(byEx).length,
    volume:Math.round(volume*10)/10, avgRpe:Math.round(avgRpe*10)/10, best, duration, byEx};
}

function weakPoints(data, days){
  const cutoff = Date.now() - (days||30)*86400000, byEx = {};
  data.logs.forEach(l => {
    const t = new Date(l.date).getTime();
    if (!isFinite(t) || t < cutoff) return;
    (byEx[l.ex] || (byEx[l.ex] = [])).push(l.rpe);
  });
  return Object.entries(byEx)
    .map(([ex, rpes]) => ({ex, avg: rpes.reduce((a,b)=>a+b,0)/rpes.length, sets: rpes.length}))
    .sort((a,b) => b.avg - a.avg);
}

function nextProgram(byEx){
  return Object.entries(byEx).map(([ex, st]) => {
    const g = suggestNext(state.data, ex);
    const info = exerciseInfo(ex, state.data);
    const logs = logsFor(state.data, ex);
    const last = logs.length ? logs[logs.length-1] : null;
    const sets = Math.min(5, Math.max(3, st.sets || 3));
    let reps, plan;
    if (last && g.weight !== null && g.weight > last.w){
      reps = info.repLow;
      plan = "вес вырос — стартуем с низа диапазона";
    } else if (last && g.weight !== null && g.weight < last.w){
      reps = info.repHigh;
      plan = "разгрузка — лёгкий вес, чистая техника";
    } else if (last){
      reps = Math.min(info.repHigh, Math.round(last.r) + 1);
      plan = "тот же вес — цель +1 повторение";
    } else {
      reps = info.repLow;
      plan = "первая тренировка — вес по ощущениям";
    }
    return {ex, weight:g.weight, sets, reps, plan, step:g.step,
      rest:restSeconds(ex, 1, state.data),
      volume: g.weight !== null ? g.weight*reps*sets : 0};
  });
}

function programSection(byEx, subtitle){
  const program = nextProgram(byEx);
  if (!program.length) return "";
  let html = '<section class="card"><h2>Программа на следующую тренировку</h2>'+
    '<p class="hint">'+esc(subtitle)+'</p>'+
    '<table><thead><tr><th>Упражнение</th><th class="num">Вес</th><th class="num">Подходы</th></tr></thead><tbody>';
  program.forEach(p => {
    html += '<tr><td>'+esc(p.ex)+'<br><span style="color:var(--muted);font-size:12px">отдых '+mmss(p.rest)+' · '+esc(p.plan)+'</span></td>'+
      '<td class="num">'+(p.weight!==null ? p.weight+' кг' : '—')+'</td>'+
      '<td class="num">'+p.sets+' × '+p.reps+'</td></tr>';
  });
  const totalSets = program.reduce((a,p) => a + p.sets, 0);
  const totalVolume = Math.round(program.reduce((a,p) => a + p.volume, 0));
  html += '</tbody></table>'+
    '<p class="hint" style="margin-top:12px">План: '+totalSets+' подх. · плановый объём ≈ '+totalVolume+' кг</p>'+
  '</section>';
  return html;
}

function rpePill(avg){
  if (avg >= 9.5) return '<span class="pill red">На отказ · RIR 0</span>';
  if (avg >= 9)   return '<span class="pill orange">Очень тяжело · RIR ~1</span>';
  if (avg >= RPE_WORK_LOW) return '<span class="pill green">Рабочая зона · RIR 2–3</span>';
  return '<span class="pill blue">Есть запас · RIR 4+</span>';
}

function rpeScaleDetails(current){
  let rows = RPE_SCALE.filter(x => x.rpe % 1 === 0).map(x =>
    '<tr'+(Number(current) === x.rpe ? ' class="now"' : '')+'><td>'+x.rpe+'</td><td>RIR '+x.rir+'</td><td>'+x.feel+'</td></tr>').join('');
  return '<details class="scale"><summary>Шкала RPE ↔ RIR (запас повторений)</summary><div class="body">'+
    '<table class="rpe"><tbody>'+rows+'</tbody></table>'+
    '<p class="hint" style="margin-top:8px">Рабочая зона для роста — RPE '+RPE_WORK_LOW+'–'+RPE_WORK_HIGH+' (в запасе 2–3 повторения). RPE 7 — это норма, а не перегруз; тревожный сигнал начинается с RPE 9.</p>'+
    '</div></details>';
}

function weekStats(data){
  const cutoff = Date.now() - 7*86400000;
  const logs = data.logs.filter(l => new Date(l.date).getTime() >= cutoff);
  const volume = logs.reduce((a,l) => a + l.w*l.r, 0);
  const avg = logs.length ? logs.reduce((a,l) => a + l.rpe, 0)/logs.length : 0;
  return {workouts:data.workouts.length, sets:logs.length,
    volume:Math.round(volume), avgRpe:Math.round(avg*10)/10};
}

function exerciseOptions(selected){
  const known = Object.keys(CATALOG);
  const custom = Object.keys(state.data.custom_categories||{});
  const fromLogs = [...new Set(state.data.logs.map(l => l.ex))];
  const all = [...new Set([...fromLogs, ...known])].sort((a,b) => a.localeCompare(b,"ru"));
  let html = '<option value="">— выберите упражнение —</option>';
  all.forEach(name => {
    html += '<option value="'+esc(name)+'"'+(name===selected?' selected':'')+'>'+esc(name)+'</option>';
  });
  html += '<option value="__custom__"'+(selected=="__custom__"?' selected':'')+'>➕ Своё упражнение…</option>';
  return html;
}

function stepper(field, value, unit, step){
  return '<div class="stepper">'+
    '<button type="button" aria-label="Меньше" data-dec="'+field+'">−</button>'+
    '<div class="val"><b>'+value+'</b><span>'+esc(unit)+'</span></div>'+
    '<button type="button" aria-label="Больше" data-inc="'+field+'">+</button>'+
  '</div>';
}

    html += '<label class="field"><span>Название упражнения</span>'+
      '<input type="text" id="customName" placeholder="Например: Жим в хаммере" value="'+esc(state.draft.customName||"")+'"></label>'+
      '<label class="field"><span>Тип упражнения (определяет шаг и отдых)</span><select id="catSelect">'+

      '</div>';
  }

  html += '<section class="card">'+
    '<div class="row between" style="margin-bottom:12px"><b>Подход '+setNo+'</b>'+
      '<span class="top-meta">шаг веса '+stepW+' кг</span></div>'+
    '<label class="field"><span>Вес</span>'+stepper("w", state.draft.w, "кг", stepW)+'</label>'+

      (state.draft.rpe >= 9 ? 'почти отказ' : state.draft.rpe >= RPE_WORK_LOW ? 'рабочая зона' : 'есть запас')+'</p>'+
      rpeScaleDetails(state.draft.rpe)+'</label>'+

  html += '<section class="card"><h2>Подходы сегодня</h2>';

  return html;
}

function chartSvg(logs){
  const W = 320, H = 190, L = 34, R = 8, T = 12, B = 26;
  if (!logs.length) return '<p class="empty">Нет данных</p>';
  const pts = logs.slice(-14);
  const ws = pts.map(p => p.w);
  let min = Math.min(...ws), max = Math.max(...ws);
  if (min === max){ min -= 1; max += 1; }
  const cw = W-L-R, ch = H-T-B;
  const x = i => L + (pts.length > 1 ? cw*i/(pts.length-1) : cw/2);
  const y = w => T + ch - ((w-min)/(max-min))*ch;
  const line = pts.map((p,i) => (i?"L":"M")+x(i).toFixed(1)+" "+y(p.w).toFixed(1)).join(" ");
  const area = line + " L"+x(pts.length-1).toFixed(1)+" "+(T+ch)+" L"+x(0).toFixed(1)+" "+(T+ch)+" Z";
  let svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="График рабочего веса">';
  svg += '<line class="grid" x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ch)+'"/>';
  svg += '<line class="grid" x1="'+L+'" y1="'+(T+ch)+'" x2="'+(W-R)+'" y2="'+(T+ch)+'"/>';
  svg += '<path class="area" d="'+area+'"/><path class="line" d="'+line+'"/>';
  pts.forEach((p,i) => { svg += '<circle class="pt" cx="'+x(i).toFixed(1)+'" cy="'+y(p.w).toFixed(1)+'" r="3"/>'; });
  svg += '<text x="2" y="'+(T+6)+'">'+max+'</text><text x="2" y="'+(T+ch)+'">'+min+'</text>';
  svg += '<text x="'+L+'" y="'+(H-6)+'">'+new Date(pts[0].date).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+'</text>';
  if (pts.length > 1) svg += '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+new Date(pts[pts.length-1].date).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+'</text>';
  return svg + '</svg>';
}

function addSet(){
  const name = currentExerciseName();
  if (!name){ toast("Сначала выберите упражнение"); return; }
  if (!CATALOG[name] && !state.data.custom_categories[norm(name)]){
    state.data.custom_categories[norm(name)] = state.draft.cat;
  }
  const entry = {ex:name, w:round2(state.draft.w), r:Math.round(state.draft.r), rpe:round2(state.draft.rpe),
    date:new Date().toISOString().slice(0,19)};

/* ---------- Звук, вибрация, системные уведомления ---------- */
let audioCtx = null, swReg = null, restNotif = null, wakeLock = null;
const NOTIF_ICON = (document.querySelector('link[rel="apple-touch-icon"]') || {}).href;

function unlockAudio(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}
document.addEventListener("pointerdown", unlockAudio, {passive:true});

function beep(freq, delay, dur, vol){
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = "sine"; osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function playSound(kind){
  const s = settingsOf(state.data);
  if (!s.sound) return;
  unlockAudio();
  const v = Math.max(0.02, Math.min(1, (parseInt(s.volume,10)||70)/100)) * 0.6;
  if (kind === "tick") beep(880, 0, 0.08, v*0.45);
  else { beep(784, 0, 0.18, v); beep(988, 0.22, 0.18, v); beep(1319, 0.44, 0.5, v); }
}
function vibrate(pattern){
  if (settingsOf(state.data).vibrate && navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
}

function notifyOn(){
  return settingsOf(state.data).notify && ("Notification" in window) && Notification.permission === "granted";
}
function notifyState(){
  if (!("Notification" in window)) return "не поддерживаются браузером";
  if (Notification.permission === "denied") return "запрещены в настройках браузера";
  if (Notification.permission !== "granted") return "разрешение ещё не запрошено";
  return settingsOf(state.data).notify ? "включены" : "разрешены, но выключены в приложении";
}
function askNotifyPermission(){
  if (!("Notification" in window)){ toast("Браузер не поддерживает уведомления"); return; }
  unlockAudio();
  Promise.resolve(Notification.requestPermission()).then(res => {
    updateSetting("notify", res === "granted");
    toast(res === "granted" ? "Готово: таймер будет висеть уведомлением" : "Уведомления запрещены в браузере");
  }).catch(() => toast("Не удалось запросить разрешение"));
}
function pushNotification(title, body, done){
  if (!notifyOn()) return;
  const opts = {body, tag:"gym-rest", renotify:true, silent:!done, icon:NOTIF_ICON, badge:NOTIF_ICON,
    requireInteraction:!!done, vibrate: done ? [300,150,300] : undefined};
  try{
    if (swReg && swReg.showNotification){ swReg.showNotification(title, opts); return; }
    closeRestNotification();
    restNotif = new Notification(title, opts);
    restNotif.onclick = () => { try{ window.focus(); }catch(e){} closeRestNotification(); };
  }catch(e){}
}
function showRestNotification(done){
  const r = state.rest;
  if (!r) return;
  pushNotification(
    done ? "Отдых закончен — в подход!" : "Отдых " + mmss(r.remaining),
    done ? r.ex + " · следующий подход №" + (r.setNo + 1)
         : r.ex + " · после подхода " + r.setNo + " · всего " + mmss(r.total),
    done);
}
function closeRestNotification(){
  try{ if (restNotif){ restNotif.close(); restNotif = null; } }catch(e){}
  try{
    if (swReg && swReg.getNotifications)
      swReg.getNotifications({tag:"gym-rest"}).then(list => list.forEach(n => n.close())).catch(() => {});
  }catch(e){}
}
function requestWakeLock(){
  if (!settingsOf(state.data).keep_awake || !navigator.wakeLock) return;
  navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {});
}
function releaseWakeLock(){ try{ if (wakeLock) wakeLock.release(); }catch(e){} wakeLock = null; }

/* ---------- Таймер отдыха: считает по меткам времени, поэтому не отстаёт в фоне ---------- */
let restTimer = null;
function saveRest(){
  try{ state.rest ? localStorage.setItem(LS_REST, JSON.stringify(state.rest)) : localStorage.removeItem(LS_REST); }catch(e){}
}
function loadRest(){
  try{
    const r = JSON.parse(localStorage.getItem(LS_REST) || "null");
    if (!r || !r.endsAt) return null;
    if (Date.now() - r.endsAt > 15*60000) return null;
    r.remaining = Math.max(0, Math.round((r.endsAt - Date.now())/1000));
    r.done = r.remaining <= 0;
    return r;
  }catch(e){ return null; }
}
function startRest(name, setNo, seconds){
  const total = seconds || restSeconds(name, setNo, state.data);
  state.rest = {total, remaining: total, ex: name, setNo, done: false, endsAt: Date.now() + total*1000};
  saveRest(); unlockAudio(); requestWakeLock(); showRestNotification(false);
  runRestTimer(); syncOsTimer();
}
function runRestTimer(){
  clearInterval(restTimer);
  restTimer = setInterval(tickRest, 250);
}
function stopRest(){
  state.rest = null;
  clearInterval(restTimer); restTimer = null;
  saveRest(); closeRestNotification(); releaseWakeLock(); syncOsTimer();
}
function addRestTime(sec){
  const r = state.rest;
  if (!r) return;
  r.total += sec;
  r.endsAt = Math.max(r.endsAt, Date.now()) + sec*1000;
  r.done = false;
  r.remaining = Math.max(0, Math.round((r.endsAt - Date.now())/1000));
  saveRest(); requestWakeLock(); showRestNotification(false); runRestTimer(); render(); syncOsTimer();
}
function tickRest(){
  const r = state.rest;
  if (!r){ clearInterval(restTimer); restTimer = null; return; }
  const rem = Math.max(0, Math.round((r.endsAt - Date.now())/1000));
  if (rem === r.remaining && !(rem <= 0 && !r.done)) return;
  const prev = r.remaining;
  r.remaining = rem;
  if (!r.done && rem <= 0){
    r.done = true; saveRest();
    clearInterval(restTimer); restTimer = null;
    playSound("done"); vibrate([300,150,300,150,600]);
    showRestNotification(true); releaseWakeLock();
    render(); syncOsTimer();
    return;
  }
  if (!r.done && settingsOf(state.data).countdown && rem > 0 && rem <= 3 && rem < prev){ playSound("tick"); vibrate(60); }
  if (!r.done && (rem <= 5 || rem % 5 === 0)) showRestNotification(false);
  paintRest(); syncOsTimer();
}
function restColor(r){
  return r.done ? "var(--green)" : r.remaining <= 10 ? "var(--red)" : r.remaining <= 30 ? "var(--orange)" : "var(--blue)";
}
function paintRest(){
  const r = state.rest;
  if (!r) return;
  const label = r.done ? "Готово" : mmss(r.remaining);
  const ringTime = document.getElementById("restTime"), barTime = document.getElementById("restbarTime");
  if (!ringTime && !barTime){ render(); return; }
  if (ringTime) ringTime.textContent = label;
  if (barTime) barTime.textContent = label;
  const ring = document.getElementById("restRing");
  if (ring){
    const C = parseFloat(ring.getAttribute("stroke-dasharray")) || 1;
    const frac = r.total ? Math.max(0, Math.min(1, r.remaining/r.total)) : 0;
    ring.setAttribute("stroke-dashoffset", ((1-frac)*C).toFixed(1));
    ring.setAttribute("stroke", restColor(r));
  }
}
function syncOsTimer(){
  const r = state.rest;
  document.title = r ? (r.done ? "Готово — в подход!" : mmss(r.remaining) + " · отдых") : "Gym Tracker";
  try{
    if (navigator.setAppBadge){
      if (r && !r.done) navigator.setAppBadge(Math.max(1, Math.ceil(r.remaining/60)));
      else if (navigator.clearAppBadge) navigator.clearAppBadge();
    }
  }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !state.rest) return;
  if (!restTimer && !state.rest.done) runRestTimer();
  requestWakeLock(); tickRest(); render();
});
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.register("sw.js").then(reg => { swReg = reg; }).catch(() => {});
}

function finishWorkout(){
  const s = state.session;
  if (!s) return;
  if (!s.entries.length){
    if (!confirm("Завершить тренировку без подходов?")) return;
    state.session = null; saveSession(); stopRest(); render(); return;
  }
  const finishedAt = new Date().toISOString().slice(0,19);
  state.data.logs.push(...s.entries);
  state.data.workouts.push({started_at: s.startedAt.slice(0,19), finished_at: finishedAt, entries: s.entries});
  saveData();
  state.report = {finishedAt, summary: summarize(s.entries, s.startedAt, finishedAt)};
  state.session = null; saveSession();
  stopRest();
  render();
}

function updateSetting(key, value){
  state.data.settings = {...settingsOf(state.data), [key]: value};
  saveData();
  render();
}

function exportData(){
  const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gym_data.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const incoming = normalizeData(JSON.parse(reader.result));
      const seen = new Set(state.data.logs.map(l => l.date+"|"+l.ex+"|"+l.w+"|"+l.r));
      incoming.logs.forEach(l => { if (!seen.has(l.date+"|"+l.ex+"|"+l.w+"|"+l.r)) state.data.logs.push(l); });
      state.data.custom_categories = {...incoming.custom_categories, ...state.data.custom_categories};
      const wseen = new Set(state.data.workouts.map(w => w.started_at));
      incoming.workouts.forEach(w => { if (!wseen.has(w.started_at)) state.data.workouts.push(w); });
      state.data.settings = {...settingsOf(state.data), ...incoming.settings};
      saveData();
      toast("Импорт завершён: подходов в истории — " + state.data.logs.length);
    } catch(e){ toast("Не удалось прочитать файл"); }
  };
  reader.readAsText(file);
}

/* единый обработчи�� кликов */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if (!t) return;

  if (t.dataset.tab){ state.tab = t.dataset.tab; render(); return; }
  if (t.id === "startWorkout") return startWorkout();
  if (t.id === "addSet") return addSet();
  if (t.id === "finishWorkout") return finishWorkout();
  if (t.id === "cancelWorkout"){
    if (confirm("Отменить тренировку? Записанные подходы не сохранятся.")){
      state.session = null; saveSession(); stopRest(); render();
    }
    return;
  }
  if (t.dataset.del !== undefined) return removeSet(parseInt(t.dataset.del,10));
  if (t.id === "restSkip"){ stopRest(); render(); return; }
  if (t.id === "restPlus" && state.rest) return addRestTime(30);
  if (t.id === "askNotify") return askNotifyPermission();
  if (t.id === "testSound"){
    unlockAudio(); playSound("done"); vibrate([300,150,300]);
    pushNotification("Проверка уведомления", "Так будет выглядеть сигнал в конце отдыха", true);
    toast("Сигнал воспроизведён"); return;
  }
  if (t.id === "closeReport"){ state.report = null; state.tab = "insights"; render(); return; }
  if (t.id === "exportData") return exportData();
  if (t.id === "resetSettings"){
    state.data.settings = {...DEFAULT_SETTINGS}; saveData(); toast("Настройки сброшены"); return;
  }

  const d = t.dataset;
  if (d.inc || d.dec){
    const field = d.inc || d.dec, dir = d.inc ? 1 : -1;
    const name = currentExerciseName();
    if (field === "w"){
      const step = name ? stepFor(name, state.data) : 2.5;
      state.draft.w = Math.max(0, round2(state.draft.w + dir*step));
    } else if (field === "r"){
      state.draft.r = Math.max(0, state.draft.r + dir);
    } else {
      state.draft.rpe = Math.min(10, Math.max(1, round2(state.draft.rpe + dir*0.5)));
    }
    render(); return;
  }
  if (d.stepinc || d.stepdec){
    const key = d.stepinc || d.stepdec, dir = d.stepinc ? 1 : -1;
    const cur = parseFloat(settingsOf(state.data)[key]) || 1;
    updateSetting(key, Math.min(25, Math.max(0.5, round2(cur + dir*0.5))));
    return;
  }
  if (d.volinc || d.voldec){
    const cur = parseInt(settingsOf(state.data).volume,10) || 70;
    updateSetting("volume", Math.min(100, Math.max(10, cur + (d.volinc ? 10 : -10))));
    playSound("tick"); return;
  }
  if (d.restinc || d.restdec){
    const key = d.restinc || d.restdec, dir = d.restinc ? 1 : -1;
    const cur = parseInt(settingsOf(state.data)[key],10) || 60;
    updateSetting(key, Math.min(600, Math.max(30, cur + dir*15)));
    return;
  }
});

document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.id === "exSelect"){
    state.draft.ex = el.value;
    if (el.value === "__custom__") state.draft.customName = state.draft.customName || "";
    else delete state.draft.customName;
    const name = currentExerciseName();
    if (name){
      const g = suggestNext(state.data, name);
      if (g.weight !== null) state.draft.w = g.weight;
      state.draft.r = exerciseInfo(name, state.data).repLow;
    }
    render(); return;
  }
  if (el.id === "customName"){ state.draft.customName = el.value; return; }
  if (el.id === "catSelect"){ state.draft.cat = el.value; render(); return; }
  if (el.id === "progressSelect"){ state.progressEx = el.value; render(); return; }
  if (el.id === "roundSelect") return updateSetting("rounding", el.value);
  if (el.id === "autoRest") return updateSetting("auto_rest", el.value === "1");
  if (el.id === "soundSel") return updateSetting("sound", el.value === "1");
  if (el.id === "countdownSel") return updateSetting("countdown", el.value === "1");
  if (el.id === "vibrateSel") return updateSetting("vibrate", el.value === "1");
  if (el.id === "awakeSel") return updateSetting("keep_awake", el.value === "1");
  if (el.id === "notifySel"){
    if (el.value === "1" && (!("Notification" in window) || Notification.permission !== "granted")) return askNotifyPermission();
    return updateSetting("notify", el.value === "1");
  }
  if (el.id === "importFile" && el.files && el.files[0]) return importData(el.files[0]);
});

document.addEventListener("input", ev => {
  if (ev.target.id === "customName") state.draft.customName = ev.target.value;
});

/* демо-состояния для проверки верстки: ?qa=session|report|insights|progress|settings */
(function qa(){
  const params = new URLSearchParams(location.search);
  const mode = params.get("qa");
  if (!mode) return;
  const day = i => new Date(Date.now() - i*86400000).toISOString().slice(0,19);
  const logs = [];
  [["Жим штанги лёжа",[70,72.5,75,77.5,80]],["Присед со штангой",[100,105,105,110]],["Жим гантелей лёжа",[28,30,30]]]
    .forEach(([ex, ws]) => ws.forEach((w,i) => logs.push({ex, w, r: 8 + (i%3), rpe: 7 + (i%3)*0.5, date: day(20 - i*3)})));
  state.data = normalizeData({logs, workouts:[{started_at:day(3), finished_at:day(3), entries:logs.slice(0,5)}]});
  if (mode === "session" || mode === "report"){
    state.session = {startedAt: new Date(Date.now()-2700000).toISOString(),
      entries: [
        {ex:"Жим штанги лёжа", w:80, r:8, rpe:7.5, date:day(0)},
        {ex:"Жим штанги лёжа", w:80, r:7, rpe:8.5, date:day(0)},
        {ex:"Тяга верхнего блока", w:60, r:11, rpe:7, date:day(0)}
      ]};
    state.draft = {ex:"Жим штанги лёжа", cat:DEFAULT_CATEGORY, w:80, r:8, rpe:8};
    state.rest = {total:180, remaining:96, ex:"Жим штанги лёжа", setNo:2, done:false, endsAt: Date.now() + 96000};
  }
  if (mode === "report"){
    const finishedAt = new Date().toISOString().slice(0,19);
    state.report = {finishedAt, summary: summarize(state.session.entries, state.session.startedAt, finishedAt)};
    state.session = null; state.rest = null;
  }
  if (mode === "insights") state.tab = "insights";
  if (mode === "progress") state.tab = "progress";
  if (mode === "settings") state.tab = "settings";
  if (mode === "empty") state.data = emptyData();
})();

/* если тренировка была начата раньше — продолжаем её после закрытия браузера */
if (state.session) state.tab = "workout";
if (!state.rest && state.session){
  const restored = loadRest();
  if (restored){
    state.rest = restored;
    if (!restored.done) runRestTimer();
  }
}
render();
syncOsTimer();
setInterval(() => { if (state.session && !state.report) render(); }, 30000);
</script>
